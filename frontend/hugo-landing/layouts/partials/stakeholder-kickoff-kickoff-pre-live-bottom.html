{{/* Transcript + End Call — matches live layout shell (idle before meeting starts) */}}
<div class="sks-kc-live-panel sks-kc-live-panel--transcript sks-kc-live-panel--idle">
    <p class="sks-kc-live-status sks-kc-live-status--idle" aria-hidden="true">&nbsp;</p>
    <p class="sks-kc-agenda-clock sks-kc-agenda-clock--idle" aria-hidden="true">&nbsp;</p>
    <div class="sks-kc-transcript sks-kc-transcript--idle" aria-label="Meeting transcript"></div>
</div>
<div class="sks-kc-live-actions">
    <button type="button" class="sks-btn sks-btn--kickoff-end" disabled aria-disabled="true">End Call</button>
</div>
