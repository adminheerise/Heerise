<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeeRise Academy | Career Simulation</title>
  <link rel="icon" href="{{ "img/logo-transparent.png" | relURL }}?v=2" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <link href="{{ "css/job-simulation.css" | relURL }}?{{ now.Unix }}" rel="stylesheet">
  <script>
    (function () {
      var host = window.location.hostname;
      var isLocal = host === "localhost" || host === "127.0.0.1";
      window.HEERISE_API_BASE = isLocal ? "http://localhost:8001" : "/api";
    })();
  </script>
</head>
<body>
  {{ partial "job-simulation.html" . }}
  <script src="{{ "js/job-simulation.js" | relURL }}?{{ now.Unix }}" defer></script>
</body>
</html>
