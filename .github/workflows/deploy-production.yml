# Deploy Heerise production (Cloud Run backend + Firebase Hosting frontend)
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY        — JSON key for a Google Cloud service account (see below)
#   GEMINI_API_KEY    — Gemini API key for Phase 3 email scoring
#   JWT_SECRET        — JWT signing secret for the FastAPI backend
#   STRIPE_SECRET_KEY — Stripe secret key (sk_live_... for real charges)
#   STRIPE_WEBHOOK_SECRET — Stripe webhook signing secret
#   PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET — PayPal REST app credentials
#   PRE_BOOTCAMP_SURVEY_URL — Google Form (or other) for the confirmation CTA
#   MAIL_FROM_INVOICE / PAYMENTS_NOTIFY_EMAIL — payment receipt sender / admin notify
#
# Optional:
#   (GEMINI_MODEL is set to gemini-2.5-flash in this workflow)
#
# Service account IAM roles (project: heeriseacademy):
#   roles/run.admin
#   roles/iam.serviceAccountUser
#   roles/cloudbuild.builds.editor
#   roles/storage.admin
#   roles/artifactregistry.writer
#   roles/firebasehosting.admin
#
# Create key: GCP Console → IAM → Service Accounts → Keys → Add JSON key
# Paste the entire JSON file as GCP_SA_KEY secret value.

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: heeriseacademy
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: heerise-backend
  FRONTEND_BASE: https://www.heeriseacademy.com
  HUGO_BASEURL: https://www.heeriseacademy.com/
  GEMINI_MODEL: gemini-2.5-flash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-production.yml'
            frontend:
              - 'frontend/hugo-landing/**'
              - 'firebase.json'
              - '.firebaserc'
              - '.github/workflows/deploy-production.yml'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          source: ./backend
          flags: --allow-unauthenticated
          env_vars: |-
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=${{ env.GEMINI_MODEL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_BASE=${{ env.FRONTEND_BASE }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
            PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET }}
            PAYPAL_ENV=live
            PRE_BOOTCAMP_SURVEY_URL=${{ secrets.PRE_BOOTCAMP_SURVEY_URL }}
            MAIL_FROM_INVOICE=${{ secrets.MAIL_FROM_INVOICE }}
            PAYMENTS_NOTIFY_EMAIL=${{ secrets.PAYMENTS_NOTIFY_EMAIL }}

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.3"
          extended: true

      - name: Build Hugo site
        working-directory: frontend/hugo-landing
        run: hugo --minify --baseURL "${{ env.HUGO_BASEURL }}"

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@13.8.0 deploy --only hosting --project ${{ env.GCP_PROJECT_ID }} --non-interactive
