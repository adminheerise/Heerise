{{/* Shared right panel — matches live call layout (disabled before meeting starts) */}}
<aside class="sks-kc-live-compose sks-kc-live-compose--idle" aria-label="Your reply">
    <div class="sks-kc-reply-form sks-kc-reply-form--vertical sks-kc-reply-form--idle">
        <label class="sks-kc-compose-label" for="sks-kc-reply-input-idle">Your response</label>
        <textarea class="sks-kc-reply-input sks-kc-reply-input--vertical" id="sks-kc-reply-input-idle" rows="12" placeholder="Type your response in English…" disabled aria-disabled="true"></textarea>
        <button type="button" class="sks-btn sks-btn--kickoff-send" disabled aria-disabled="true">Send</button>
    </div>
</aside>
