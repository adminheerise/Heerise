<!-- Clean Accessible Top Bar with Custom HeeRise Academy SVG Logo (from prototype HTML; do not replace with site navbar) -->
<header class="topbar" role="banner">
  <div class="topbar-inner">
    <button type="button" class="brand" onclick="goHome()" aria-label="HeeRise Academy Career Simulation Home">
      <!-- Custom Faceted Geometric 'H' Logo with Constellation Network -->
      <svg class="brand-logo-svg" viewBox="0 0 100 112" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="hrLeftCol" x1="12" y1="6" x2="38" y2="106" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2B3964"/>
            <stop offset="50%" stop-color="#0D152C"/>
            <stop offset="100%" stop-color="#022A3A"/>
          </linearGradient>
          <linearGradient id="hrRightCol" x1="62" y1="6" x2="88" y2="106" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#324372"/>
            <stop offset="55%" stop-color="#101A36"/>
            <stop offset="100%" stop-color="#022A3A"/>
          </linearGradient>
          <linearGradient id="hrFoldLight" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7C90C4"/>
            <stop offset="100%" stop-color="#182342"/>
          </linearGradient>
          <linearGradient id="hrCrossBar" x1="22" y1="74" x2="78" y2="34" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0B1329"/>
            <stop offset="50%" stop-color="#1D2B52"/>
            <stop offset="100%" stop-color="#2E4074"/>
          </linearGradient>
        </defs>
        <!-- Left Vertical Faceted Pillar -->
        <polygon points="12,6 38,28 38,54 24,64 24,84 38,76 38,92 12,106" fill="url(#hrLeftCol)"/>
        <!-- Left Upper Highlight Fold -->
        <polygon points="38,28 24,64 38,54" fill="url(#hrFoldLight)"/>
        <!-- Left Lower Highlight Fold -->
        <polygon points="18,86 38,76 38,92" fill="url(#hrFoldLight)" opacity="0.85"/>
        <!-- Right Vertical Faceted Pillar -->
        <polygon points="88,6 62,28 62,40 76,32 76,54 62,64 62,92 88,106" fill="url(#hrRightCol)"/>
        <!-- Right Upper Highlight Fold -->
        <polygon points="62,28 82,24 62,40" fill="url(#hrFoldLight)" opacity="0.85"/>
        <!-- Right Lower Highlight Fold -->
        <polygon points="76,48 62,64 62,92" fill="url(#hrFoldLight)"/>
        <!-- Diagonal Rising Crossbar -->
        <polygon points="22,64 78,26 78,48 22,86" fill="url(#hrCrossBar)"/>
        <!-- Constellation Network Lines & Nodes inside the H -->
        <g stroke="#8CA2D6" stroke-width="0.9" opacity="0.55">
          <line x1="16" y1="24" x2="32" y2="42"/>
          <line x1="32" y1="42" x2="20" y2="72"/>
          <line x1="20" y1="72" x2="34" y2="86"/>
          <line x1="32" y1="42" x2="46" y2="58"/>
          <line x1="46" y1="58" x2="66" y2="38"/>
          <line x1="66" y1="38" x2="82" y2="22"/>
          <line x1="66" y1="38" x2="82" y2="52"/>
          <line x1="46" y1="58" x2="74" y2="82"/>
        </g>
        <g fill="#B0C4F2" opacity="0.85">
          <circle cx="32" cy="42" r="2"/>
          <circle cx="46" cy="58" r="3"/>
          <circle cx="66" cy="38" r="2.2"/>
          <circle cx="82" cy="22" r="1.8"/>
          <circle cx="20" cy="72" r="1.8"/>
          <circle cx="74" cy="82" r="1.8"/>
        </g>
      </svg>
      <div class="brand-text-wrap">
        <span class="brand-name">HeeRise Academy</span>
        <span class="brand-sub">Career Simulation</span>
      </div>
    </button>

    <nav class="stepper" id="stepperNav" aria-label="Simulation Progress"></nav>

    <div>
      <button type="button" class="btn-ghost btn-sm" id="restartBtn" onclick="goHome()" style="visibility:hidden;">Start Over</button>
    </div>
  </div>
</header>

<!-- Main Content Container -->
<main class="container" id="app" role="main" aria-live="polite"></main>
